name: Processing checks and private packages

on:
  push:
    branches:
    - main
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: processing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Coordinator and host checks
        run: python -m unittest discover -v
      - name: Synthetic worker checks
        run: python -m unittest discover -s engines/treedar/tests -p test_prototype_worker.py -v
      - name: Publication boundary checks
        run: python .github/scripts/test_publish_images.py

  publish:
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' && (github.repository == 'ledgetoptechnologies/LedgeTop-Processing' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build unchanged recipes, smoke check, publish and verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_images.py
      - name: Retain metadata-only publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processing-package-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish-receipt.json
          if-no-files-found: warn
          retention-days: 14
