services:
  coordinator:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    ports:
      - "${PROCESSING_BIND_ADDRESS:-127.0.0.1}:${PROCESSING_PORT:-8080}:8080"
    environment:
      PROCESSING_API_TOKEN: ${PROCESSING_API_TOKEN:?set a private token of at least 32 characters}
      LOCAL_NODE_URL: ${LOCAL_NODE_URL:-}
      MAIN_NODE_URL: ${MAIN_NODE_URL:-}
      LOCAL_MAX_PHOTOS: ${LOCAL_MAX_PHOTOS:-1000}
      LOCAL_MAX_INPUT_BYTES: ${LOCAL_MAX_INPUT_BYTES:-21474836480}
